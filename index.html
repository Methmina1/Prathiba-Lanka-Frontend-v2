<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f0d" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="PrathibhaLanka Voyages - private, tailor-made journeys across Sri Lanka. Cultural triangle, wildlife safaris, hill country and the southern coast."
    />
    <!-- Link previews. Facebook and WhatsApp are how these journeys actually get shared, and without
         these tags a link there shows a bare URL. Both have to be absolute, so they are built from
         %SITE_URL%, which vite.config.js substitutes at build time (SITE_URL, defaulting to the
         agency's own domain). One card serves every platform: 1200x630 is what all of them fall back
         to, and public/images/sl/share.jpg is that size. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PrathibhaLanka Voyages" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="PrathibhaLanka Voyages | Private Journeys Through Sri Lanka" />
    <meta
      property="og:description"
      content="Private, tailor-made journeys across Sri Lanka - the cultural triangle, wildlife safaris, the hill country and the southern coast."
    />
    <meta property="og:image" content="%SITE_URL%/images/sl/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sri Lanka, arranged with care by PrathibhaLanka Voyages" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PrathibhaLanka Voyages | Private Journeys Through Sri Lanka" />
    <meta
      name="twitter:description"
      content="Private, tailor-made journeys across Sri Lanka - the cultural triangle, wildlife safaris, the hill country and the southern coast."
    />
    <meta name="twitter:image" content="%SITE_URL%/images/sl/share.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Caveat is the handwriting on the note beside the social cards; the other two drive the
         whole site. All three are one request. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>PrathibhaLanka Voyages | Private Journeys Through Sri Lanka</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
