# Headers every response carries. Kept in one file because nginx does not merge add_header across
# levels: a block that declares its own add_header (a cache rule, say) drops the inherited ones, so
# each block that needs them includes this file.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
