name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, user-updates]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & render check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Vite copies public/ into the build verbatim, so anything parked there ships. The
      # full-resolution originals live in images-originals/ for exactly this reason: if one is ever
      # moved back, the build gets 330 MB heavier and the photographs become public.
      - name: The build carries the site and not the photo archive
        run: |
          test ! -e "dist/images/Sri lanka" \
            || { echo "::error::the full-resolution originals are being published"; exit 1; }
          SIZE=$(du -sm dist | cut -f1)
          echo "dist is ${SIZE} MB"
          test "$SIZE" -lt 100 \
            || { echo "::error::dist is ${SIZE} MB - something that does not belong is in public/"; exit 1; }

      # Renders all 24 routes in Node (public + admin, plus both admin access rules): fails on
      # undefined components, broken props, or if the planning/tracking panels leak back onto the
      # home page.
      - name: Render check
        run: npm run check:render

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # A real browser and a real layout. The render check runs in Node, so it cannot see geometry,
  # clicks or navigation - this job builds the app, serves it, and drives it with Chromium. The API
  # is mocked per test, so it needs no backend.
  browser-tests:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --with-deps pulls in the system libraries Chromium needs on a bare runner.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The artifact Railway actually runs. nginx renders its configuration at start-up, so this proves
  # the template, the /healthz endpoint the platform polls, the SPA fallback that makes a deep link
  # work, and that a missing BACKEND_URL stops the container with a sentence rather than a stack
  # trace.
  docker-image:
    name: Docker image serves the site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t prathibalanka-web:ci .

      - name: Start it
        run: docker run -d --name web -p 8080:80 -e BACKEND_URL=http://127.0.0.1:9 prathibalanka-web:ci

      - name: Health endpoint
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/healthz; then
              echo "answering after ${i} checks"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/healthz never answered"
          docker logs web
          exit 1

      - name: The app is served, deep links included
        run: |
          curl -sf http://localhost:8080/ | grep -q 'id="root"'
          curl -sf http://localhost:8080/journeys | grep -q 'id="root"'
          ASSET=$(curl -sf http://localhost:8080/ | grep -o '/assets/[^"]*' | head -1)
          test -n "$ASSET" || { echo "::error::no hashed asset in index.html"; exit 1; }
          curl -sfo /dev/null "http://localhost:8080${ASSET}"
          echo "index.html, the SPA fallback and ${ASSET} all answered."

      - name: A missing BACKEND_URL fails with an explanation
        run: |
          if timeout 60 docker run --rm -e BACKEND_URL= prathibalanka-web:ci > /tmp/no-backend.log 2>&1; then
            echo "::error::the image started with no BACKEND_URL"; exit 1
          fi
          grep -q 'BACKEND_URL is not set' /tmp/no-backend.log || { cat /tmp/no-backend.log; exit 1; }
          echo "Refused to start, and said why."

      - name: Container log
        if: always()
        run: docker logs web || true

  # Opt-in deployment. Enable once the repository has Pages turned on and the variable
  # DEPLOY_PAGES=true is set (Settings -> Secrets and variables -> Actions -> Variables).
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for deployment
        run: npm run build
        env:
          # Pages serves the app from /<repo>/, so the router needs the matching basename.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # Pages has no rewrite rules: serving index.html as 404.html keeps deep links working.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
